[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "cincoenraya"
version = "0.1.0"
description = "Juego de cinco en raya con plataforma para bots"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
authors = [
    { name = "Pablo Valcarce" },
    { name = "Ana Laserna" },
]
dependencies = []

[project.optional-dependencies]
dev = ["pytest", "pytest-cov"]
web = ["streamlit"]
docs = ["mkdocs>=1.6,<2", "mkdocs-material", "mkdocstrings[python]"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]