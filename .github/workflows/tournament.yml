name: Torneo

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  tournament:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Instalar el paquete
        run: pip install -e .
      - name: Ejecutar el torneo
        run: python -m cincoenraya.tournament --games 2 --html public/index.html --output public/clasificacion.md
      - uses: actions/upload-pages-artifact@v3
        with:
          path: public

  deploy:
    needs: tournament
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4